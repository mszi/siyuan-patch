[package]
name = "s3-direct-bridge-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
tokio-rustls = "0.26"
